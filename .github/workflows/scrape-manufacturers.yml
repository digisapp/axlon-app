name: Scrape Manufacturer Catalogs

on:
  # Run quarterly (1st of Jan, Apr, Jul, Oct at 8 AM UTC)
  schedule:
    - cron: '0 8 1 1,4,7,10 *'
  # Allow manual trigger from GitHub UI or API
  workflow_dispatch:
    inputs:
      manufacturer:
        description: 'Specific manufacturer slug (leave empty for all)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome

      - name: Run manufacturer scraper
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Environment variable, not shell interpolation: the input is
          # reachable from the admin API, and `${{ }}` inside `run:` would let
          # a crafted value execute commands on a runner holding these keys.
          MANUFACTURER_INPUT: ${{ github.event.inputs.manufacturer }}
        run: |
          if [ -n "$MANUFACTURER_INPUT" ]; then
            if ! printf '%s' "$MANUFACTURER_INPUT" | grep -Eq '^[a-z0-9-]{1,60}$'; then
              echo "Invalid manufacturer slug: $MANUFACTURER_INPUT" >&2
              exit 1
            fi
            node scripts/scrape-all-manufacturers.mjs --manufacturer="$MANUFACTURER_INPUT"
          else
            node scripts/scrape-all-manufacturers.mjs
          fi
