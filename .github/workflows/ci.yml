name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Puppeteer is a devDependency used only by local scraper scripts —
      # skip the ~150MB Chromium download in CI
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholders only — env validation is skipped during the Next.js
          # build phase, and all data-fetching pages render dynamically.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
          NEXT_PUBLIC_APP_URL: https://ci.invalid
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          RESEND_API_KEY: re_placeholder
          RESEND_WEBHOOK_SECRET: whsec_placeholder
          XAI_API_KEY: xai-placeholder
          CRON_SECRET: ci-placeholder-cron-secret
          INTERNAL_API_SECRET: ci-placeholder-internal-secret
