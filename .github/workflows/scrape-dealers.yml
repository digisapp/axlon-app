name: Scrape Dealer Inventory

on:
  # Twice a month (1st and 15th, 06:00 UTC). The old 60-day cadence plus a
  # 30-minute job timeout meant every scheduled run was cancelled part-way
  # (Pinnacle alone takes ~16 min) and dealers past #6 were never scraped.
  schedule:
    - cron: '0 6 1,15 * *'
  workflow_dispatch:
    inputs:
      dealer:
        description: 'Specific dealer slug (leave empty for all active dealers)'
        required: false
        default: ''

jobs:
  # Resolve the dealer list from scripts/dealer-configs.mjs so each dealer
  # gets its own job below (isolated timeout, parallel, one failure can't
  # cancel the rest).
  plan:
    runs-on: ubuntu-latest
    outputs:
      dealers: ${{ steps.list.outputs.dealers }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Resolve dealers
        id: list
        env:
          # Passed through the environment, never interpolated into the shell:
          # this input is reachable from the admin "trigger scrape" API.
          DEALER_INPUT: ${{ github.event.inputs.dealer }}
        run: |
          if [ -n "$DEALER_INPUT" ] && ! printf '%s' "$DEALER_INPUT" | grep -Eq '^[a-z0-9-]{1,60}$'; then
            echo "Invalid dealer slug: $DEALER_INPUT" >&2
            exit 1
          fi
          dealers=$(node --input-type=module -e '
            import { getActiveDealers, getDealerBySlug } from "./scripts/dealer-configs.mjs";
            const wanted = process.env.DEALER_INPUT;
            if (wanted) {
              if (!getDealerBySlug(wanted)) { console.error(`Unknown dealer: ${wanted}`); process.exit(1); }
              console.log(JSON.stringify([wanted]));
            } else {
              console.log(JSON.stringify(getActiveDealers().map((d) => d.slug)));
            }
          ')
          echo "dealers=$dealers" >> "$GITHUB_OUTPUT"
          echo "Scraping: $dealers"

  scrape:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        dealer: ${{ fromJson(needs.plan.outputs.dealers) }}
    concurrency:
      group: scrape-dealer-${{ matrix.dealer }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome

      - name: Scrape ${{ matrix.dealer }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEALER: ${{ matrix.dealer }}
        run: node scripts/scrape-dealer-inventory.mjs --dealer "$DEALER"
